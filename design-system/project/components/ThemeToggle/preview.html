<!-- @dsCard group="Controls" height=120 -->
<div style="display:flex;gap:24px;align-items:center;padding:24px 32px;font:var(--t-meta)/1 var(--font-grotesk);color:var(--muted)">
  <span style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <button class="theme-toggle" aria-pressed="true" aria-label="Switch to dark theme"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M8 1.7a6.3 6.3 0 0 1 0 12.6z" fill="currentColor" stroke="none"/></svg></button>rest
  </span>
  <span style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <button class="theme-toggle" aria-pressed="true" aria-label="Switch to dark theme" style="color:var(--fg);border-color:var(--faint)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M8 1.7a6.3 6.3 0 0 1 0 12.6z" fill="currentColor" stroke="none"/></svg></button>hover / active
  </span>
  <span style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <button class="theme-toggle" aria-pressed="true" aria-label="Switch to dark theme" style="outline:2px solid var(--fg);outline-offset:2px;border-radius:var(--r-xs)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M8 1.7a6.3 6.3 0 0 1 0 12.6z" fill="currentColor" stroke="none"/></svg></button>focus-visible
  </span>
</div>
