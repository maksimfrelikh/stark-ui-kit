<!-- @dsCard height=300 -->
<!-- derivation
blocks: brand-ink 240×192 (r-md corners), brand-line-2 144×96, brand-line 96×144 — the whole palette is three greys and the ink, so the ink slab leads and the two tints give relief; sides are multiples of 48 (maxw/25)
arrangement: a staggered stack bleeding off the right edge, right of x=480 — sections on the site are two columns split by one vertical rule
pattern: hairline rules (brand-line-2 at 1px), four of them, crossing the blocks vertically — "no horizontal rules, one vertical hairline" is the most specific thing this system says about itself
scales: r-md 10px on the slab, r-sm 6px on the tints; gaps 24 and 48 = steps of the 1200/25 grid (maxw ÷ 25)
-->
<div style="position:relative;width:960px;height:300px;background:var(--bg);color:var(--fg);font-family:var(--font-grotesk);overflow:hidden">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true" style="position:absolute;inset:0">
    <style>.ink{fill:var(--ink)}.l2{fill:var(--line-2)}.l1{fill:var(--line)}.rule{stroke:var(--line-2);stroke-width:1}</style>
    <rect class="ink" x="528" y="36" width="240" height="192" rx="10"/>
    <rect class="l2" x="792" y="84" width="144" height="96" rx="6"/>
    <rect class="l1" x="600" y="204" width="96" height="144" rx="6"/>
    <rect class="l2" x="816" y="228" width="144" height="120" rx="6"/>
    <line class="rule" x1="504" y1="0" x2="504" y2="300"/>
    <line class="rule" x1="780" y1="0" x2="780" y2="300"/>
    <line class="rule" x1="900" y1="0" x2="900" y2="300"/>
    <line class="rule" x1="564" y1="240" x2="564" y2="300"/>
  </svg>
  <div style="position:absolute;left:48px;bottom:40px;max-width:440px">
    <div style="font-size:120px;font-weight:600;line-height:.9;letter-spacing:-0.035em">Stark</div>
    <div style="margin-top:14px;font-size:13px;color:var(--muted);letter-spacing:0.02em">Monochrome by decision. Black, white, grey — and air instead of rules.</div>
  </div>
</div>
