<!-- @dsCard group="Overlays" height=420 -->
<div style="position:relative;height:400px;background:var(--bg)">
  <div style="padding:16px 24px;display:flex;justify-content:flex-end"><button class="cmdk-hint"><span class="cmdk-key">⌘K</span></button></div>
  <div class="cmdk-overlay" style="position:absolute;padding-top:40px">
    <div class="cmdk" role="dialog" aria-modal="true" aria-label="Commands">
      <div class="cmdk-top"><span class="cmdk-prompt" aria-hidden="true">&gt;</span><input class="cmdk-input" role="combobox" aria-expanded="true" aria-activedescendant="opt-1" placeholder="Type a command…" value="pro"><kbd class="cmdk-esc">esc</kbd></div>
      <div class="cmdk-list" role="listbox">
        <p class="cmdk-group">Navigate</p>
        <div class="cmdk-item active" role="option" id="opt-1" aria-selected="true"><span class="cmdk-item-label">Projects</span><span class="cmdk-item-hint">↓</span></div>
        <div class="cmdk-item" role="option" aria-selected="false"><span class="cmdk-item-label">Writing</span><span class="cmdk-item-hint">↓</span></div>
        <p class="cmdk-group">Actions</p>
        <div class="cmdk-item" role="option" aria-selected="false"><span class="cmdk-item-label">Copy email</span><span class="cmdk-item-hint">⧉</span></div>
        <div class="cmdk-item" role="option" aria-selected="false"><span class="cmdk-item-label">Open GitHub</span><span class="cmdk-item-hint">↗</span></div>
      </div>
    </div>
  </div>
</div>
